# ~/.config/tmux/tmux.conf
# =============================================================================
# Personal tmux config — ported from JoseAmador95/zellij-config.
# Auto-loaded because the repo is cloned to ~/.config/tmux. Everything here is
# versioned; there are no templates (tmux expands ~ and $HOME natively).
# See AGENTS.md and README.md.
#
# Built in phases (each a testable commit):
#   1) core options   2) sessions & SSH shield + navigation
#   3) status bar & UX 4) copy   5) work config
# Phases 3–5 are appended below as they land.
# =============================================================================


# --- 1. Core options ---------------------------------------------------------

# Prefix: Ctrl-a (Zellij used Ctrl-a to enter Normal mode). Ctrl-a Ctrl-a = literal Ctrl-a.
set  -g  prefix C-a
unbind   C-b
bind     C-a send-prefix
# Secondary leader: Ctrl-Space also enters the prefix, so both work (no either/or). If you ever
# reach for a literal Ctrl-Space inside an app, send it with `prefix + C-Space`.
# Heads-up if you drop Ctrl-a later: macOS binds Ctrl-Space to "select previous input source"
# (Settings ▸ Keyboard ▸ Shortcuts) and nvim often uses it for completion.
set  -g  prefix2 C-Space
bind     C-Space send-prefix -2

set  -sg escape-time 10          # 500ms default breaks Esc responsiveness in nvim
set  -g  history-limit 100000    # matches Zellij's scroll_buffer_size 100000
set  -g  mouse on                # req. 6 (mouse friendly)
setw -g  mode-keys vi            # req. 6 (vim-motion friendly)
set  -s  set-clipboard on        # let a pane's OSC 52 (e.g. nvim over SSH) reach the clipboard
set  -g  focus-events on         # nvim's FocusGained→checktime autocmd needs this
set  -g  allow-passthrough on    # let nvim's OSC 11 bg query / graphics passthrough reach Ghostty

set  -g  default-shell /bin/zsh  # = Zellij default_shell; override per machine in local.conf
set  -g  status-position top     # Zellij paints the bar at the top
set  -g  base-index 1            # Alt-1 = first window, like Zellij tabs
setw -g  pane-base-index 1
set  -g  renumber-windows on     # closing window 2 of 1,2,3 renumbers to 1,2 so Alt-2 still works
setw -g  automatic-rename off    # respect layout names (agent/editor/git/term); nvim sets no title
set  -g  detach-on-destroy off   # killing a session jumps to another live one, does not exit
set  -g  pane-border-status top  # framed pane with a name, like Zellij

# tmux's default display-time is 750ms, which is too fast to read a message you are meant to ACT
# on — the pane-died toast in section 2b names the key that revives it.
set  -g  display-time 4000
# tmux picks `status-keys vi` when $EDITOR/$VISUAL looks like vi, which it does here (nvim). That
# silently imposes vi editing on `prefix + :`, on palette.sh's command-prompt and on ask.sh. Say
# emacs outright so those one-line prompts behave like every other one-line prompt.
set  -g  status-keys emacs

set  -g  default-terminal "tmux-256color"
set  -as terminal-features ",xterm-ghostty:RGB"  # truecolor for the outer term (nvim termguicolors)
# OSC 52 clipboard: xterm-ghostty matches the xterm* pattern → `Ms` is already on.
# Verify with:  tmux info | grep Ms:


# --- 2. Sessions & SSH shield ------------------------------------------------
# See scripts/session-created.sh and scripts/ssh-host.sh. `default-command` is a SESSION
# option → it applies to new-window AND split-window and never leaks to local sessions.
# Every session named ssh_* gets a remote default-command, whoever created it.
# The script takes NO argument and sweeps every session. Passing #{hook_session_name} would splice
# a user-typed name straight into a shell command line: "my proj" arrived as $1="my", and a name
# containing $(…) would have been executed — reachable by typing it into the session popup's
# rename prompt. See the header of session-created.sh.
set-hook -g session-created 'run-shell "~/.config/tmux/scripts/session-created.sh"'
# It runs on RENAME too, for two reasons: the pill colour is derived from the name, so a rename
# must re-derive it (it used to keep the colour it was born with), and renaming crosses the ssh_
# boundary in both directions — a session renamed away from ssh_* must lose its SSH
# default-command, or it would keep entering a host whose name is no longer on screen.
set-hook -g session-renamed 'run-shell "~/.config/tmux/scripts/session-created.sh"'
# Sessions alive before this file was loaded never saw a session-created hook, so sweep them once
# here (also on every `prefix + r` reload).
run-shell "~/.config/tmux/scripts/session-created.sh"
# The bar's session strip is derived from the session list. session-created.sh already refreshes it
# for create and rename; these are the two events that never reach that script.
set-hook -g session-closed          'run-shell "~/.config/tmux/scripts/session-strip.sh"'
set-hook -g client-session-changed  'run-shell "~/.config/tmux/scripts/session-strip.sh"'
# Remember which sessions exist and where, so a reboot does not lose them — `t` replays the list.
# -ga APPENDS to the hook instead of replacing it, so this runs alongside the strip refresh above.
# These are the two events that change the answer and do not already reach session-created.sh.
# There is no timer and no #() on the bar to hang one off, which is precisely why tmux-continuum's
# trigger cannot work here — it drives its save from the status redraw, and status-interval is 0.
set-hook -ga session-closed          'run-shell "~/.config/tmux/scripts/session-save.sh"'
set-hook -ga client-session-changed  'run-shell "~/.config/tmux/scripts/session-save.sh"'


# --- 2b. Navigation (flat, idiomatic tmux; smart-splits aware) ---------------

# Alt-hjkl move focus between panes WITHOUT the prefix (replicates Zellij's locked mode).
# They must be is_vim-guarded: inside a nvim pane the keys are forwarded to nvim so smart-splits
# can navigate nvim's own splits (and hand off to the neighbouring tmux pane at the edge);
# everywhere else tmux moves the pane. Without this, tmux would steal Alt-hjkl from nvim.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)$'"
bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'
# In copy-mode the pane runs tmux, not nvim, so move panes directly.
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# Alt-n = Zellij-like split (scripts/split.sh splits the longer axis -> fibonacci-ish spiral),
# unless the window is @no_split (dev's agent/editor/git), where it refuses. Alt-t = new window.
# The default split keys prefix "/% are guarded the same way. All inherit the current directory.
bind -n M-n if -F '#{@no_split}' 'display-message "this pane is locked (no splits)"' 'run-shell "~/.config/tmux/scripts/split.sh"'
bind -n M-t new-window   -c "#{pane_current_path}"
bind '"' if -F '#{@no_split}' 'display-message "this pane is locked (no splits)"' 'split-window -v -c "#{pane_current_path}"'
bind  %  if -F '#{@no_split}' 'display-message "this pane is locked (no splits)"' 'split-window -h -c "#{pane_current_path}"' 

# Alt-<digit> selects a window (like Zellij Alt-1…9).
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Alt-; / Alt-' = previous/next window (tab), wrapping at the ends. The digit keys jump straight to
# a given tab; these step through them one at a time. tmux always owns them (no is_vim guard), so
# you can flip tabs even from inside a nvim pane. (prefix + n/p, the native next/prev-window, still
# work too.)
#
# These were Alt-←/→ and that was wrong twice over. It did not fire on macOS — an arrow only
# reaches tmux as M-Left if the terminal sends ESC [1;3D, and Option composes a character instead
# unless the terminal is explicitly told to treat it as Alt — and reaching for the arrows breaks
# the flow of a keyboard-only config anyway.
#
# ; and ' are chosen to sit next to Alt-, / Alt-. (previous/next SESSION), so left-is-previous holds
# for both pairs and the hand does not travel between the two ideas. Brackets are the other common
# "tabs" mnemonic and are STILL not an option: Alt-[ IS the terminal's ESC-[ CSI introducer and
# parses unreliably. Both keys are quoted because ; is tmux's command separator and ' is a quote.
bind -n "M-;" previous-window
bind -n "M-'" next-window

# prefix + < / > move the CURRENT window left or right in the list. -d keeps the focus on it, so
# you can shove a tab into place with a repeat (`-r`) rather than chasing it.
# These shadow a tmux default: < and > open the window and pane context menus. That is an accepted
# trade — those menus are still one right-click away on the status bar, which is how they are
# actually reached, whereas reordering tabs had no key at all.
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Session switching. Alt-, / Alt-. = prev/next (native). Alt-s = the session tree.
bind -n M-, switch-client -p
bind -n M-. switch-client -n

# M-s = choose-tree, tmux's own session picker. This REPLACED a 183-line fzf popup, and the reason
# is latency: that popup implemented vim's `jj` to leave insert mode, which fzf can only express as
# a `transform` running an external command — so every j and k press forked a shell, parsed the
# script and made three tmux IPC round-trips just to answer "down". Measured at 18 ms per keypress
# here and worse on macOS, on the two keys used for navigating.
#
# The old script's header claimed choose-tree could not compete ("keys are hardcoded"). Measured,
# that was wrong: j/k navigate natively, C-s searches by name with n/N to repeat, x kills (with a
# confirm), t tags and X kills the tagged, and -K/-F/-O/-f customise it. All in-process.
#
#   -Z  zoom the pane so the tree gets the whole window
#   -s  start with sessions collapsed — this is a session picker, not a window browser
#   -O time   most recently used first, the closest thing to session-order.sh's rule that
#             choose-tree can express (it only accepts index/name/time)
#   -K  the per-item shortcut key. #{line} is 0-based, so +1 makes the shortcuts 1..9 and lines up
#       with `prefix + <digit>` for the first entry, which is always the session you came from.
#
# What choose-tree cannot do is RENAME and CREATE. Both already live in the Alt-Space palette, so
# nothing was lost — see the palette's 'rename session' / 'new session' entries.
# -F replaces only the text AFTER choose-tree's own "<name>:" label, not the whole line, so it must
# NOT repeat the session name — the first attempt rendered "(1) + main: main ● 1w".
_tree="choose-tree -Zs -O time -K '#{e|+|:1,#{line}}' -F '#{?session_attached,● ,}#{session_windows}w'"
bind -n M-s $_tree
# Clicking the session pill (status-right) opens the same tree. MouseDown1StatusRight is unbound by
# default (only MouseDown1Status, the window list, is), so there is no conflict.
bind -n MouseDown1StatusRight $_tree

# prefix + u = every URL in this pane, in a popup; Enter opens the ones you marked. #{pane_id} is
# expanded by tmux BEFORE the popup exists, so the capture targets the pane you invoked it from.
bind u display-popup -E -w 70% -h 45% -T " urls " "~/.config/tmux/scripts/urls.sh '#{pane_id}'"

# M-Space = command palette (fzf popup with curated tmux actions). Fills the "Alt-Space command
# palette" documented in README/AGENTS/bootstrap.
bind -n M-Space display-popup -E -w 60% -h 55% -T " palette " "~/.config/tmux/scripts/palette.sh"
# prefix + @ = turn this pane into a session of its own. It takes #{pane_id}, which tmux expands
# before the popup exists, so it acts on the pane you invoked it from and not on the popup.
#
# prefix + e and prefix + F used to live here too, backed by scripts/grab.sh and scripts/fuzzback.sh.
# Both were hand-written reimplementations of plugins — extrakto and tmux-fuzzback, which they were
# even named after — and §5 now loads the real ones on the same two keys. The keys stayed: extrakto's
# usual prefix + Tab is last-session here, and prefix + / is tmux's describe-key.
bind @ run-shell "~/.config/tmux/scripts/promote.sh '#{pane_id}'"

# F12 = OFF mode: every tmux key stops responding, so a tmux running INSIDE this one (or a remote
# one over ssh) gets the whole keyboard. F12 again brings it back. The status bar goes with it, so
# there is no doubt about which tmux you are talking to.
# The trap specific to this config: prefix2 must be unset too (section 1 binds Ctrl-Space as a
# second leader), or "off" would still fire on it. `set -u` here means UNSET, not the shell flag.
bind -T root F12 \
  set prefix None \; set prefix2 None \; set key-table off \; set status off \; refresh-client -S
bind -T off  F12 \
  set -u prefix \; set -u prefix2 \; set -u key-table \; set -u status \; refresh-client -S

# prefix + P = start/stop writing this pane to a file. `pipe-pane -o` is natively a toggle, and
# #{pane_pipe} is evaluated after it, so the message reports the state you just moved INTO.
# This is the live half of tmux-logging; its other half — dump the whole scrollback — is prefix + y.
bind P pipe-pane -o "cat >> ~/tmux-#S-#I-#P.log" \; \
  display-message "pane log #{?pane_pipe,ON → ~/tmux-#S-#I-#P.log,off}"

# prefix + ? = searchable cheatsheet of the custom bindings (replaces the raw default list-keys).
bind ? display-popup -E -w 64% -h 70% -T " keys " "~/.config/tmux/scripts/keys.sh"
bind    Tab switch-client -l      # last session toggle (prefix + Tab)

# prefix + <digit> = jump to the N-th session of the (sorted) status bar, no pane opened.
bind 1 run-shell '~/.config/tmux/scripts/session-goto.sh 1'
bind 2 run-shell '~/.config/tmux/scripts/session-goto.sh 2'
bind 3 run-shell '~/.config/tmux/scripts/session-goto.sh 3'
bind 4 run-shell '~/.config/tmux/scripts/session-goto.sh 4'
bind 5 run-shell '~/.config/tmux/scripts/session-goto.sh 5'
bind 6 run-shell '~/.config/tmux/scripts/session-goto.sh 6'
bind 7 run-shell '~/.config/tmux/scripts/session-goto.sh 7'
bind 8 run-shell '~/.config/tmux/scripts/session-goto.sh 8'
bind 9 run-shell '~/.config/tmux/scripts/session-goto.sh 9'

# Pane resize (repeatable): prefix + H/J/K/L.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload this config.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Revive a "dead" pane: re-run its original command in place. The dev-layout tool windows
# (agent/editor/git) keep their window when the app exits — the pane goes dead instead of the
# window vanishing (remain-on-exit, set in sessions/dev.conf) — so `prefix + R` brings the app
# back. `respawn-pane` (no -k) only touches DEAD panes; on a live pane it safely no-ops.
bind R respawn-pane \; display-message "pane respawned"

# Aviso when a pane dies. remain-on-exit alone just FREEZES the pane — nothing tells you it died
# or that it can come back, so it reads as "the pane broke". The moment a tool pane's process
# exits, toast the revive key. This fires ONLY for a process that EXITED (→ a dead pane); it does
# NOT fire for `prefix + x` (kill-pane), which destroys the pane outright — nothing is left to
# revive. The toast shows once; its persistent half is the dead-pane border marker (section 3).
# prefix + N — tell me when THIS window goes quiet, i.e. when the long thing running in it stops
# producing output. Deliberately a per-window toggle and not `set -g monitor-silence 15`: the alert
# fires for any non-current window that falls silent, so globally it would flag every idle
# background window forever. `visual-silence on` makes it a message rather than only a bar flag.
set  -g  visual-silence on
bind N if -F '#{monitor-silence}' \
  'setw monitor-silence 0  ; display-message "silence alert off"' \
  'setw monitor-silence 15 ; display-message "silence alert on — 15s quiet in this window"'

set-hook -g pane-died 'display-message "pane died — prefix + R to revive"'


# --- 3. Theme ----------------------------------------------------------------
# Every colour in this config comes from scripts/theme.sh — the palette, the semantic roles
# (@thm_accent, @thm_dim, @thm_ink…) and the per-host ssh tints. tmux.conf reads them back with
# #{E:@thm_…} and the scripts with `tmux display-message -p`. Nothing else names a colour.
#
# Four Catppuccin flavours ship; this picks one. To try another live, without editing anything:
#   :set -g @thm_flavor mocha ; run-shell "~/.config/tmux/scripts/theme.sh"
# (also in the Alt-Space palette). The bar is `bg=terminal` — it paints no background of its own —
# so a light flavour wants a light terminal and a dark one a dark terminal; tmux only owns the
# foreground here.
#
# The pill INK is computed in that script, not written down: white reads on Latte's blue (4.91:1)
# and not on Mocha's (2.10:1), and within Latte it reads on blue but not on yellow. All 56 pairings
# across the four flavours are measured at >= 4.5:1.
set  -g  @thm_flavor "latte"
run-shell "~/.config/tmux/scripts/theme.sh"

# Follow the terminal's light/dark theme automatically (tmux >= 3.6). tmux 3.6 learned mode 2031,
# so it asks the terminal which theme it is using and re-asks when the OS flips — and exposes that
# as the client-light-theme / client-dark-theme hooks plus #{client_theme}. theme.sh already ships
# all four flavours, so the whole feature is these two lines. It is what tmux-dark-notify existed
# to provide, minus the plugin, the daemon and the dependency.
#
# THE GUARD IS REQUIRED, not defensive habit: on 3.4 `set-hook -g client-light-theme` answers
# "invalid option: client-light-theme" (verified), so an unguarded pair breaks the config on the
# version floor this repo still supports.
#
# The comparison is FLOAT, not semver — tmux parses "3.6" as a number. Verified: 3.4 -> false,
# 3.6 -> true, 3.6b -> true, 3.8 -> true, 4.0 -> true, but 3.10 -> FALSE, because 3.10 reads as
# 3.1. Correct for every tmux that has shipped; if upstream ever releases 3.10 this needs a real
# version compare, the same trap bootstrap.sh's own parser has to dodge.
%if "#{>=:#{version},3.6}"
set-hook -g client-light-theme 'set -g @thm_flavor latte ; run-shell "~/.config/tmux/scripts/theme.sh"'
set-hook -g client-dark-theme  'set -g @thm_flavor mocha ; run-shell "~/.config/tmux/scripts/theme.sh"'
%endif


# --- 3b. Status bar & UX -----------------------------------------------------
# The bar sits at the top (section 1) and paints NO background of its own: `bg=terminal` hands the
# background back to Ghostty. The accent survives only inside the pills — the move VSCode made
# between Light+/Dark+ and Light/Dark Modern, and the one Catppuccin makes too.

set  -g  status on
# status-interval is the ONLY thing that re-runs a #() on the bar, which is not what "interval"
# suggests and is worth writing down, because it decides what can go on this bar at all. Measured
# on 3.4 with 6 windows and a real attached client:
#   status-interval 5, idle .............. 6 forks every 5s — once per window, per TICK
#   30 window switches (ordinary redraws) . +6 — one tick; the cached value is reused
#   30 x refresh-client -S ................ +183 — a forced refresh bypasses the cache
#   status-interval 0 (this config) ....... 6 at attach, then ZERO
# So with the timer off, a #() runs once and its output is frozen for the life of the client. The
# cost of a #() here would not be forks, it would be a bar showing a stale value forever. That is
# why every status module (battery, cpu, gitmux, clima) forces status-interval > 0, and why none of
# them fit: they also want status-right, which the session strip owns.
set  -g  status-interval 0
set  -g  status-justify absolute-centre
set  -g  status-style "bg=terminal,fg=#{E:@thm_dim}"
set  -g  status-left-length  100   # a truncated line eats the closing cap; leave plenty of room
set  -g  status-right-length 100

# ONE row. A second row carrying a solid #[fill=…] accent rule was tried here (the IDE
# title-bar underline) and removed after living with it: it costs a whole terminal row and, unlike
# every other element on this bar, it carries no information. If you ever want it back:
#   set -g status 2 ; set -g status-format[1] "#[fill=#{E:@thm_accent}]"

# Left: the session name in a rounded pill.  and  are Nerd Font caps (U+E0B6/U+E0B4); the cap's
# fg is the pill colour and its bg is the bar, which is what makes the join seamless.
# The colour is amber while the prefix is held, otherwise the session's own @pill (section 2) —
# a session-scoped user option published by scripts/session-created.sh. @pill is the ACCENT for
# every local session, so all three pills on this bar match; only ssh_<host> sessions get a tint of
# their own, because "this is a remote box" is the one distinction worth a second colour. Both live
# in user options so the conditional is written once instead of four times, and so the pill's shape
# exists in exactly one place. A format inside a #[…] style works because tmux expands formats
# BEFORE it parses styles.
# @pill / @pill_ink are the session's pill background and its text. Both are published per session
# by scripts/session-created.sh; the values here are only the fallback for a session the hook has
# not reached yet, and they must be LITERAL hex — an option read with a bare #{@…} is inserted
# without being expanded again, so a "#{E:@thm_accent}" stored here would reach the style verbatim.
set  -g  @pill     "#1e66f5"
set  -g  @pill_ink "#ffffff"
# Left: NOTHING for a local session — the session name lives in the strip on the right, and
# having it at both ends was the complaint. What survives here is the one thing the right side
# cannot say as loudly: an ssh_<host> session shows its HOST, in that host's own tint. Same
# two-chip vocabulary as the tabs (coloured glyph chip + neutral name chip).
# The prefix cue is gone from here too: @mode already renders a PREFIX pill on the right, and a
# cue that only fires for remote sessions is worse than one cue that always fires.
# Commas inside the conditional need #, — the branch is one argument to #{?…}.
set  -g  status-left "#{?#{m:ssh_*,#S}, #[fg=#{@pill}#,bg=terminal]#[fg=#{@pill_ink}#,bg=#{@pill}#,bold] #[fg=#{E:@thm_text}#,bg=#{E:@thm_chip}#,nobold] #{s/^ssh_//:session_name} #[fg=#{E:@thm_chip}#,bg=terminal] ,}"

# Right: only what is true right now, then the numbered session strip.
set  -g  @mode "#{?client_prefix, PREFIX,}#{?pane_in_mode, #{pane_mode},}#{?window_zoomed_flag, ZOOM,}#{?pane_synchronized, SYNC,}"
set  -g  status-right "#{?#{E:@mode}, #[fg=#{E:@thm_accent}#,bg=terminal]#[fg=#{E:@thm_ink}#,bg=#{E:@thm_accent}#,bold]#{E:@mode} #[fg=#{E:@thm_accent}#,bg=terminal],}#{E:@session_strip}"

# Window list. Each tab is TWO chips, not one flat block: the accent holds only the index,
# the name sits on a neutral chip, and the caps take the colour of whichever chip they
# terminate. That hard vertical edge inside one object is what stops the accent reading as a
# slab -- it is the shape catppuccin uses, and the reason its pill looks like an object.
# Inactive tabs get a quiet card rather than floating on the bar, which is the other half of
# the "flat" complaint. The card forces the text colour: @thm_dim on a card measures 3.20:1,
# a fail, so an inactive tab uses @thm_text on @thm_card (7.06:1) and reads quiet because the
# CARD is low-contrast, not because the text is.
# name — icon-only tabs stop being readable the moment two shells are open. The nested #{?#{==:…}}
# chain is pure in-process string work; the obvious alternative, #(…), forks once per window per
# status-interval TICK (measured: 6 windows = 6 forks every interval) — and at this config's
# status-interval of 0 it would never re-run at all. See §3b.
set  -g  @wicon "#{?#{==:#{pane_current_command},nvim},,#{?#{==:#{pane_current_command},vim},,#{?#{==:#{pane_current_command},git},,#{?#{==:#{pane_current_command},lazygit},,#{?#{==:#{pane_current_command},node},,#{?#{==:#{pane_current_command},python},,#{?#{==:#{pane_current_command},python3},,#{?#{==:#{pane_current_command},ssh},,#{?#{==:#{pane_current_command},docker},,}}}}}}}}}"
setw -g  window-status-separator " "
setw -g  window-status-format          "#[fg=#{E:@thm_card},bg=terminal]#[fg=#{E:@thm_text},bg=#{E:@thm_card},nobold] #I #{E:@wicon} #W #[fg=#{E:@thm_card},bg=terminal]"
setw -g  window-status-current-format  "#[fg=#{E:@thm_accent},bg=terminal]#[fg=#{E:@thm_ink},bg=#{E:@thm_accent},bold] #I #[fg=#{E:@thm_text},bg=#{E:@thm_chip},nobold] #{E:@wicon} #W#{?window_zoomed_flag,  ,} #[fg=#{E:@thm_chip},bg=terminal]"
setw -g  window-status-activity-style  "fg=#{E:@thm_accent},bold"

# Popups and menus follow the same palette. That includes the right-click menu, which is not
# decoration here: it is the ONLY way to dismiss a popup with the mouse, because tmux never closes
# a popup on an outside LEFT-click. That was established while the session manager was an fzf popup
# and the finding outlives it — popup_key_cb returns "keep open" for out-of-bounds mouse events in
# every version from 3.4 to master AND swallows the click, so the program inside never sees it and
# --no-mouse changes nothing. The way out is a right-PRESS outside dragged onto Close (tmux >= 3.3);
# it is a gesture, not a click. Still true for the remaining popups: Alt-Space, prefix + ? and
# prefix + u.
set  -g  popup-border-lines rounded
set  -g  popup-style        "bg=terminal"
set  -g  popup-border-style "fg=#{E:@thm_accent}"
set  -g  menu-border-lines   rounded
set  -g  menu-style          "bg=terminal"
set  -g  menu-border-style   "fg=#{E:@thm_accent}"
set  -g  menu-selected-style "bg=#{E:@thm_accent},fg=#{E:@thm_ink},bold"

# Match borders, messages and the copy-mode selection to the same palette. `pane-border-indicators
# colour` tints only the half of the border that points at the active pane — quieter than an arrow.
set  -g  pane-border-style         "fg=#{E:@thm_line}"
set  -g  pane-active-border-style  "fg=#{E:@thm_accent},bold"
set  -g  pane-border-indicators    colour
# Frame each pane with its index + window name (the Zellij-like named frame `pane-border-status
# top` promises). A DEAD pane — its app exited under remain-on-exit — turns the frame red and
# spells out the revive key, so the frozen pane explains itself even after you switch away and
# back: the persistent half of the pane-died aviso (the toast in section 2b shows only once).
set  -g  pane-border-format  "#{?pane_dead,#[fg=#{E:@thm_dead}#,bold] ✗ #{pane_index} #{window_name} — prefix + R to revive ,#[fg=#{E:@thm_line}] #{pane_index} #{window_name} }"
set  -g  message-style             "bg=#{E:@thm_accent},fg=#{E:@thm_ink}"
set  -g  message-command-style     "bg=#{E:@thm_accent},fg=#{E:@thm_ink}"
set  -g  mode-style                "bg=#{E:@thm_sel_bg},fg=#{E:@thm_sel_fg}"


# --- 4. Copy mode ------------------------------------------------------------
# Selecting text must NOT snap the pane back to the live bottom. tmux's default copy bindings
# — the mouse-drag release AND the vi `y`/Enter — use `…-and-cancel`, which leaves copy-mode
# and drops you at the prompt, losing your scroll position. Rebind them to copy WITHOUT
# cancelling: the text still reaches the clipboard (set-clipboard on → OSC 52) and you stay
# where you were reading, free to keep scrolling or refine the selection. Leave copy-mode
# explicitly with `q` or Esc.

# Alt-v enters copy-mode without the prefix (the default prefix + [ still works). It mirrors `v`
# below — the begin-selection key — and the "visual" mnemonic, so the same finger both enters the
# mode and starts a selection. tmux grabs it globally; the only thing it shadows is zsh emacs-mode's
# M-v (page-up on the command line), which this vi-mode workflow doesn't use. Leave with q/Esc.
bind -n M-v copy-mode

# NOT BOUND, on purpose: double-click-copies-word and triple-click-copies-line, which is what
# tmux-click-copy exists for. tmux 3.4 ALREADY does both by default, and its version is better than
# the plugin's recipe — it guards with `if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}"
# { send-keys -M }`, so a double-click inside nvim or less goes to the application instead of
# yanking the pane into copy-mode, and it pauses 0.3s so you SEE the selection before it is copied.
# Rebinding these to copy-selection-no-clear (to match the no-snap-to-bottom rule below) was tried
# and reverted: it silently dropped that guard. `set-clipboard on` already gets the default's
# copy-pipe-and-cancel to the system clipboard, so there was nothing left to gain.

bind -T copy-mode-vi v                  send-keys -X begin-selection        # vim muscle memory (tmux default is Space)
bind -T copy-mode-vi y                  send-keys -X copy-selection-no-clear
bind -T copy-mode-vi Enter              send-keys -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane  send-keys -X copy-selection-no-clear

# Ctrl-C copies too (Linux/Windows muscle memory). Only rebound INSIDE copy-mode — where tmux
# owns the key — so it never shadows SIGINT at the shell. Default here was `cancel` (exits and
# snaps to the bottom), so this is a strict win. macOS Cmd-C can't be a tmux binding: the
# Command modifier is swallowed by the terminal, never reaching tmux. It isn't needed anyway —
# set-clipboard on means the selection already hits the system clipboard the moment you finish
# selecting; on a Mac just select, then Cmd-V. (Use Ctrl-C in copy-mode if you want an explicit key.)
bind -T copy-mode-vi C-c                send-keys -X copy-selection-no-clear

# prefix + y = copy the WHOLE pane scrollback (what functions.sh:73 promised and was missing).
bind y run-shell "tmux capture-pane -pJS - -t '#{pane_id}' | tmux load-buffer -w -" \; display-message "scrollback copied"
# prefix + Y = copy ONLY the last command's output, via the OSC 133 marks shell/functions.sh emits.
#
# This was the same sequence inlined here, ending in an unconditional `display-message "last output
# copied"` — and that message was a lie whenever the marks were missing. tmux.1 is explicit that
# previous-prompt/next-prompt "do nothing" without them, so the cursor never moved, the selection
# was empty, and the bar reported success anyway. The script runs the sequence and then checks
# whether a buffer actually appeared, so a missing shell integration names itself.
bind Y run-shell "~/.config/tmux/scripts/copy-last-output.sh '#{pane_id}'"

# U / O jump BACK to the previous URL or file path. tmux has had real regex search since 3.1, so
# tmux-copycat's engine is dead weight — these are its canned patterns and nothing else. U overlaps
# with prefix + u (the URL popup) on purpose: the popup is for opening one, this is for putting the
# cursor on one so you can select it. Both keys were free in copy-mode-vi; C-u and C-f are not,
# they scroll.
bind -T copy-mode-vi U send-keys -X search-backward "(https?|ftp|file)://[^ ]+"
bind -T copy-mode-vi O send-keys -X search-backward "(^|[^[:alnum:]_])[[:alnum:]_.~/-]*/[[:alnum:]_.~/-]+"

# d/u = jump ten lines in copy-mode, like vim's 10j / 10k. `send-keys -X -N <count>` repeats the
# action, so this is native — no loop, no script.
#
# They used to be halfpage-down/up, which duplicated C-d/C-u for no gain: half a page is too coarse
# for reading a log, and you already have C-d/C-u when you want it. The original reason for binding
# d/u at all still holds and is why they are not simply dropped — overshooting the bottom with C-d
# sends the extra keypress through as EOF and closes the shell, while d/u never leave copy-mode.
# (Capital D is left untouched: it is tmux's copy-end-of-line.)
bind -T copy-mode-vi d send-keys -X -N 10 cursor-down
bind -T copy-mode-vi u send-keys -X -N 10 cursor-up

# --- 5. Plugins --------------------------------------------------------------
# Vendored as git submodules under plugins/, fetched by bootstrap.sh. No plugin manager: the
# submodule SHA is the pin, visible in the diff, and `git submodule update --remote` is the
# upgrade. See the build commit for why TPM was measured and rejected.
#
# ORDER MATTERS TWICE.
#   1) Each plugin reads its @options when its .tmux file runs, so every `set` below must come
#      BEFORE the matching load. They are grouped per plugin for that reason, not for tidiness.
#   2) `run-shell` completes before the next line of this file is parsed (measured on 3.4, an
#      isolated socket: a `set` after a run-shell wins over one the run-shell performed). So the
#      work/local layer at the end of this file still overrides everything a plugin does.
#
# Each load is guarded: a clone without --recurse-submodules leaves plugins/ empty, and the config
# must degrade rather than spray "No such file or directory" on every reload.
#
# `_plug=` is a tmux config variable (tmux >= 3.1), not a shell one — tmux expands $_plug itself,
# including the ~. Verified under `env -i`, so it does not quietly depend on the ambient shell.
_plug='~/.config/tmux/plugins'

# tmux-fingers — hint letters painted over every path/URL/hash on screen; press the letter to copy.
# This is the one genuinely new interaction: grab.sh gave you a LIST, fingers labels the screen in
# place. Its default key F is taken here (fuzzback) and its default jump key J is taken
# (resize-pane -D), so both move; f replaces tmux's find-window, which the session manager and
# prefix + F between them already cover.
#
# THE GUARD CHECKS THE BINARY, NOT THE .tmux FILE, and that is the whole point. Read the loader:
# if it finds no binary it runs `tmux run-shell -b "bash install-wizard.sh"` and exits — and it
# does that BEFORE it ever reads @fingers-skip-wizard, which only guards the separate
# version-mismatch re-run further down. So skip-wizard alone does NOT stop a fresh machine from
# firing a network installer in the background every time this file is sourced. Only refusing to
# load the plugin until the binary exists does. bootstrap.sh is what puts it there.
set -g @fingers-skip-wizard 1
set -g @fingers-key f
set -g @fingers-jump-key C-f
if-shell "command -v tmux-fingers >/dev/null 2>&1 || [ -x $_plug/tmux-fingers/bin/tmux-fingers ]" \
         "run-shell $_plug/tmux-fingers/tmux-fingers.tmux"

# tmux-fuzzback — replaces scripts/fuzzback.sh. Same feature plus a preview pane, and it handles
# more of the quirk our version had to reverse-engineer: `goto-line` counts backwards from the
# bottom and only addresses 0..history_size, and where ours simply discarded the lines outside that
# window, upstream computes a correction to reach them. Bound to F, the key ours already used.
#
# Two defaults are overridden so it looks like the rest of this config rather than like a plugin:
# it opens in a SPLIT by default (every other picker here is a popup), and its colours are a static
# option, which theme.sh publishes so they follow a flavour switch.
set -g @fuzzback-bind F
set -g @fuzzback-popup 1
set -g @fuzzback-popup-size '80%'
if-shell "[ -f $_plug/tmux-fuzzback/fuzzback.tmux ]" "run-shell $_plug/tmux-fuzzback/fuzzback.tmux"

# extrakto — replaces scripts/grab.sh. Adds a Python 3.6+ dependency, which is the price for
# insert/complete/clipboard modes and its git-hash and container-name patterns. Its default key is
# Tab, which is the last-session toggle here, so it keeps grab.sh's e.
set -g @extrakto_key e
if-shell "[ -f $_plug/extrakto/extrakto.tmux ]" "run-shell $_plug/extrakto/extrakto.tmux"

# tmux-sessionist was evaluated here to replace scripts/promote.sh and REJECTED. Keeping the note
# because "prefix + @ is its own default binding" makes it look like an obvious swap, and it is not:
#
#   - Its promote_pane runs `new-session -d` with no -s, so the promoted session gets tmux's
#     auto-number: 1, 2, 3. Every session in this config is NAMED — that is the whole model. The
#     names drive the strip, prefix + <digit>, and the ssh_<host> shield. promote.sh asks for one
#     with ask.sh so Esc cancels, and refuses to clobber an existing session. That is a feature,
#     not ceremony, and the plugin has no equivalent.
#   - Its other six bindings duplicate the Alt-s manager, and they cannot be declined: an empty
#     @sessionist-* value is treated as unset by its own get_tmux_option, which returns the
#     default anyway. Measured.
#   - Loading it silently replaced prefix + C-Space, this config's SECONDARY LEADER, because its
#     promote-window default is `C-@` and C-@ and C-Space are the same keystroke in tmux. A
#     key-name diff showed "3 new keys, 0 lost" while the leader was gone; only comparing
#     key -> COMMAND caught it.
#
# Net: it would have cost the leader, two tmux defaults and named sessions to save 48 lines.

# tmux-open — in copy-mode, act on the selection: o opens it, C-o opens it in $EDITOR. Complements
# prefix + u (which LISTS every URL in the pane) rather than replacing it. C-o was free; o
# deliberately replaces tmux's other-end, which swaps the ends of a selection — a niche command
# next to "open the thing I just selected".
#
# The fallback matters on Linux. tmux-open picks `open` on macOS and `xdg-open` elsewhere, and
# with NEITHER present it binds `copy-pipe-and-cancel ''` — an empty command. That is worse than
# not binding at all: o would silently eat the selection and open nothing, having displaced a
# working tmux command to do it. On a headless box, o goes back to other-end.
if-shell "[ -f $_plug/tmux-open/open.tmux ]" "run-shell $_plug/tmux-open/open.tmux"
if-shell "! command -v open >/dev/null 2>&1 && ! command -v xdg-open >/dev/null 2>&1" \
         "bind -T copy-mode-vi o send-keys -X other-end"

# C-o is TAKEN BACK from tmux-open. Its `o` is fine — it hands the selection to open/xdg-open — but
# its editor binding opened an empty buffer for anything that was not already an exact path, and
# the reasons are structural rather than a bad default: it resolves $EDITOR when the CONFIG loads
# (from the tmux server's environment, so an unset EDITOR silently becomes `vi`), it TYPES the
# command into whatever the pane is running instead of running it, it passes the selection
# untrimmed, and it resolves the path against the shell's cwd without ever checking the file
# exists. scripts/open-selection.sh does all four properly and, when the target is not a file, says
# so — an empty buffer is a worse answer than a message. It also understands file:line, so a grep
# or compiler hit lands on the right line.
bind -T copy-mode-vi C-o send-keys -X copy-pipe-and-cancel \
  "~/.config/tmux/scripts/open-selection.sh '#{pane_current_path}'"

# tmux-easy-motion — vim easy-motion jumps inside copy-mode. Its prefix-table binding is disabled
# on purpose: it defaults to Space, which is tmux's next-layout, and a motion table is only useful
# once you are already in copy-mode. In copy-mode s was free (this config uses v to begin a
# selection, so tmux's own Space binding there is untouched).
set -g @easy-motion-prefix-enabled 0
set -g @easy-motion-copy-mode-prefix s
if-shell "[ -f $_plug/tmux-easy-motion/easy_motion.tmux ]" "run-shell $_plug/tmux-easy-motion/easy_motion.tmux"


# --- 6. Work / per-machine layer ---------------------------------------------
# These two lines were documented in README.md and AGENTS.md, and referred to by bootstrap.sh's
# closing message, but were never actually in this file — so `local.conf` has silently done
# nothing. Restored here rather than deleted from the docs, because layering is one of the two
# reasons this config left Zellij (which has no `include`) and the SSH shield's escape-route notes
# assume a work layer exists.
#
# LAST ON PURPOSE. §5's plugins load above, and a run-shell finishes before the next line is
# parsed, so anything set here overrides both this file and every plugin. -q is silent when the
# file is absent, which is the normal case for one of the two.
source-file -q ~/.config/tmux-work/work.conf   # private (company) repo, cloned separately
source-file -q ~/.config/tmux/local.conf       # per-machine, gitignored
