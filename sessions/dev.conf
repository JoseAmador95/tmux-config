# sessions/dev.conf — the "dev" project layout: 4 windows (agent · editor · git · term).
#
# NOT a tmux `source-file`: this is a POSIX sh fragment that the `tcwd` shell function
# SOURCE (`. dev.conf`) with $SESS and $DIR already set in the environment. tmux's source-file
# does not expand shell variables, so we drive tmux from the shell instead. This keeps any
# per-session `set-option -t` right next to the `new-session`.
#
# Expects: $SESS (session name), $DIR (working directory). Caller ensures the session does
# not already exist (new-session here is not -A on purpose, so the layout is only built once).

tmux new-session -d -s "$SESS" -c "$DIR" -n agent "$HOME/.config/tmux/scripts/agent.sh"
tmux new-window  -t "$SESS" -n editor -c "$DIR" nvim
tmux new-window  -t "$SESS" -n git    -c "$DIR" lazygit
tmux new-window  -t "$SESS" -n term   -c "$DIR"

# Keep the tool windows when their app exits: the pane goes "dead" (shows the exit status)
# instead of the window vanishing, so `prefix + R` (respawn-pane) relaunches the app in place.
# `term` is intentionally NOT set — it stays a plain, disposable shell (typing `exit` closes it).
tmux set-option -w -t "$SESS:agent"  remain-on-exit on
tmux set-option -w -t "$SESS:editor" remain-on-exit on
tmux set-option -w -t "$SESS:git"    remain-on-exit on

# Lock the tool windows against splits: agent/editor/git are single full-window panels, so
# M-n and prefix "/% refuse to split them (see scripts/split.sh). `term` stays splittable.
tmux set-option -w -t "$SESS:agent"  @no_split 1
tmux set-option -w -t "$SESS:editor" @no_split 1
tmux set-option -w -t "$SESS:git"    @no_split 1

tmux set-option -t "$SESS" @layout dev
tmux select-window -t "$SESS":agent

# session-created fires while the first window is still being constructed, so its roster write
# cannot yet know this is a complete dev session. Publish one final atomic snapshot now.
"$HOME/.config/tmux/scripts/session-save.sh"
