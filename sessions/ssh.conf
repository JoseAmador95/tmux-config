# sessions/ssh.conf — REFERENCE ONLY. `tssh <host>` (shell/functions.sh) generates the real
# session per host; you do not source this file directly. It documents the shape of an SSH
# session so the behavior is discoverable in one place.
#
# Expects: $SESS = ssh_<host-sanitized>, $HOST = the host (or ~/.ssh/config alias).
#
# The first pane enters the host explicitly via ssh-host.sh. The `session-created` hook
# (scripts/session-created.sh) independently sets `default-command` for any ssh_* session, so
# new windows (M-t) and splits (M-n) also re-enter the host. Two layers, one guarantee:
# a pane in an SSH session can never silently fall back to a local shell.

tmux new-session -d -s "$SESS" "$HOME/.config/tmux/scripts/ssh-host.sh $HOST"
# default-command is set by the hook; nothing else to do here.
